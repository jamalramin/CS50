<!doctype html>

<html lang="en">
  <head>
    <link
      href="https://fonts.googleapis.com/css2?family=Montserrat:wght@500&display=swap"
      rel="stylesheet"
    />
    <link href="/static/styles.css" rel="stylesheet" />
    <title>Birthdays</title>
  </head>
  <body>
    <div class="header">
      <h1>Birthdays</h1>
    </div>
    <div class="container">
      <div class="section">
        <h2>Add a Birthday</h2>
        <!-- TODO: Create a form for users to submit a name, a month, and a day -->
        <form action="/birthday" method="get">
          <input name="name" required autocomplete="none" placeholder="Name" />
          <input name="year" required autocomplete="none" placeholder="Year" />
          <input
            name="month"
            required
            autocomplete="none"
            placeholder="Month"
          />
          <input name="day" required autocomplete="none" placeholder="Day" />
          <input type="submit" value="Add Birthday" />
        </form>
      </div>

      <div class="section">
        <h2>All Birthdays</h2>
        <table>
          <thead>
            <tr>
              <th>Name</th>
              <th>Birthday</th>
            </tr>
          </thead>
          {% for person in people %}
          <tbody>
            <!-- TODO: Loop through the database entries to display them in this table -->

            <td>{{ person.name }}</td>
            <td>{{ person.year }}</td>
            <td>{{ person.month }}</td>
            <td>{{ person.day }}</td>
          </tbody>
          {% endfor %}
        </table>
      </div>
    </div>
  </body>
</html>
